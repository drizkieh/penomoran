<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Nomor BAUT / BAPP / BAST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#232016;
    --ink-soft:#5b5646;
    --paper:#F6F2E9;
    --card:#FFFFFF;
    --line:#DDD5C2;
    --stamp:#A8471E;
    --stamp-soft:#F1E0D3;
    --ok:#3E6B4F;
    --ok-soft:#E3EEE5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Courier New',ui-monospace,monospace;
    background:var(--paper);
    color:var(--ink);
    padding:32px 16px 64px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;margin-bottom:16px;
    flex-wrap:wrap;gap:10px;
  }
  h1{font-size:20px;letter-spacing:0.5px;margin:0;font-weight:700;text-transform:uppercase;}
  .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .admin-toggle{font-size:11px;color:var(--ink-soft);cursor:pointer;user-select:none;border-bottom:1px dotted var(--ink-soft);}
  .admin-toggle.active{color:var(--stamp);border-color:var(--stamp);}
  .connbar{font-size:11px;margin-bottom:24px;padding:8px 12px;border:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .connbar .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .dot.ok{background:var(--ok);}
  .dot.bad{background:var(--stamp);}
  .dot.pending{background:#B4B2A9;}

  .grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:24px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--line);padding:22px 24px;position:relative;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px);opacity:0.15;}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:6px;}
  select,input[type=text],input[type=number]{
    width:100%;padding:10px 10px;font-family:inherit;font-size:14px;
    border:1px solid var(--line);background:#FCFAF4;color:var(--ink);margin-bottom:16px;
  }
  select:focus,input:focus{outline:2px solid var(--stamp);outline-offset:1px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .btn{display:inline-block;padding:11px 20px;font-family:inherit;font-size:13px;
    text-transform:uppercase;letter-spacing:0.6px;font-weight:700;
    background:var(--ink);color:var(--paper);border:none;cursor:pointer;}
  .btn:hover{background:#3a3524;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn.ghost:hover{background:var(--ink);color:var(--paper);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .err{color:var(--stamp);font-size:12px;margin:-8px 0 14px;}

  .preview{margin-top:4px;padding:16px;background:var(--stamp-soft);border:1px dashed var(--stamp);}
  .preview .label{font-size:11px;color:var(--stamp);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
  .preview .num{font-size:15px;font-weight:700;word-break:break-all;line-height:1.6;}

  .result{margin-top:16px;padding:16px;background:var(--ok-soft);border:1px solid var(--ok);display:none;}
  .result.show{display:block;}
  .result .label{font-size:11px;color:var(--ok);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
  .result .num{font-size:14px;font-weight:700;word-break:break-all;line-height:1.7;}
  .result .num div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--ok);padding:3px 0;}

  .counters h2{font-size:13px;text-transform:uppercase;letter-spacing:0.6px;margin:0 0 14px;color:var(--ink-soft);}
  .ctable{width:100%;border-collapse:collapse;font-size:13px;}
  .ctable th,.ctable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .ctable th{color:var(--ink-soft);text-transform:uppercase;font-size:10px;letter-spacing:0.5px;}
  .ctable td.n{font-weight:700;text-align:right;}
  .ctable input[type=number]{width:60px;padding:4px;font-family:inherit;border:1px solid var(--line);text-align:right;margin:0;}

  .history{margin-top:28px;}
  .history h2{font-size:13px;text-transform:uppercase;letter-spacing:0.6px;margin:0 0 14px;color:var(--ink-soft);}
  .htoolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .htoolbar select,.htoolbar input[type=text]{margin:0;width:auto;flex:1;min-width:140px;}
  .htoolbar .spacer{flex:1;min-width:0;}
  table.hlist{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.hlist th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--ink);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
  table.hlist td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.hlist td.num{font-weight:700;}
  .badge{display:inline-block;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:0.3px;}
  .badge.BAUT{background:#E6F1FB;color:#0C447C;}
  .badge.BAPP{background:#FAEEDA;color:#633806;}
  .badge.BAST{background:#EAF3DE;color:#27500A;}
  .copybtn{font-size:11px;padding:4px 9px;background:transparent;border:1px solid var(--line);cursor:pointer;font-family:inherit;}
  .copybtn:hover{border-color:var(--ink);}
  .delbtn{font-size:11px;padding:4px 9px;background:transparent;border:1px solid var(--stamp);color:var(--stamp);cursor:pointer;font-family:inherit;margin-left:6px;}
  .empty{padding:24px;text-align:center;color:var(--ink-soft);font-size:12px;}
  .loading{padding:24px;text-align:center;color:var(--ink-soft);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Generator nomor dokumen</h1>
      <div class="sub">BAUT &middot; BAPP &middot; BAST &nbsp;—&nbsp; format NNN/ISM-STAGE/No PO/bulan-romawi/tahun</div>
    </div>
    <div class="admin-toggle" id="adminToggle">mode admin</div>
  </header>

  <div class="connbar" id="connbar"><span><span class="dot pending" id="connDot"></span><span id="connText">Menghubungkan ke Google Sheet…</span></span></div>

  <div class="grid">
    <div class="card">
      <label for="stage">Stage</label>
      <select id="stage">
        <option value="BAUT">BAUT</option>
        <option value="BAPP">BAPP</option>
        <option value="BAST">BAST</option>
      </select>

      <label for="po">No PO</label>
      <input type="text" id="po" placeholder="contoh: 4110007378">
      <div class="err" id="poErr" style="display:none;">Isi No PO dulu.</div>

      <div class="row3">
        <div>
          <label for="month">Bulan</label>
          <select id="month"></select>
        </div>
        <div>
          <label for="year">Tahun</label>
          <input type="text" id="year">
        </div>
        <div>
          <label for="qty">Jumlah nomor</label>
          <input type="number" id="qty" value="1" min="1" max="50">
        </div>
      </div>

      <div class="preview" id="previewBox">
        <div class="label">Nomor berikutnya</div>
        <div class="num" id="previewNum">—</div>
      </div>

      <div style="margin-top:16px;">
        <button class="btn" id="genBtn">Generate nomor</button>
      </div>

      <div class="result" id="resultBox">
        <div class="label">Tersimpan ke Sheet</div>
        <div class="num" id="resultNum"></div>
      </div>
    </div>

    <div class="card counters">
      <h2>Counter aktif (tahun berjalan)</h2>
      <table class="ctable" id="counterTable">
        <thead><tr><th>Stage</th><th style="text-align:right">Nomor terakhir</th><th></th></tr></thead>
        <tbody id="counterBody"><tr><td colspan="3" class="loading">Memuat…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="history">
    <h2>Riwayat nomor</h2>
    <div class="htoolbar">
      <label style="margin:0;display:flex;align-items:center;gap:6px;font-size:11px;"><input type="checkbox" id="selectAll" style="width:auto;margin:0;">pilih semua</label>
      <select id="filterStage">
        <option value="">Semua stage</option>
        <option value="BAUT">BAUT</option>
        <option value="BAPP">BAPP</option>
        <option value="BAST">BAST</option>
      </select>
      <input type="text" id="filterPo" placeholder="cari No PO...">
      <span class="spacer"></span>
      <button class="btn ghost" id="exportSelectedBtn">Eksport terpilih (.xlsx)</button>
      <button class="btn ghost" id="exportAllBtn">Eksport semua (.xlsx)</button>
    </div>
    <table class="hlist">
      <thead><tr><th></th><th>Stage</th><th>No PO</th><th>Nomor</th><th>Dibuat</th><th></th></tr></thead>
      <tbody id="historyBody"><tr><td colspan="6" class="loading">Memuat…</td></tr></tbody>
    </table>
  </div>

</div>

<script>
// ==== GANTI URL INI setelah deploy Code.gs sebagai Web App ====
const APPS_SCRIPT_URL = 'PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI';
// ================================================================

const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const STAGES = ['BAUT','BAPP','BAST'];
let isAdmin = false;
let counters = {};
let history = [];
let connected = false;

const monthSel = document.getElementById('month');
ROMAN.forEach((r,i)=>{
  const o = document.createElement('option');
  o.value = i+1; o.textContent = r + ' (' + (i+1).toString().padStart(2,'0') + ')';
  monthSel.appendChild(o);
});
const now = new Date();
monthSel.value = now.getMonth()+1;
document.getElementById('year').value = now.getFullYear();

function pad3(n){ return String(n).padStart(3,'0'); }
function formatNumber(seq, stage, po, month, year){
  return pad3(seq) + '/ISM-' + stage + '/' + po + '/' + ROMAN[month-1] + '/' + year;
}

function setConn(state, text){
  const dot = document.getElementById('connDot');
  dot.className = 'dot ' + state;
  document.getElementById('connText').textContent = text;
  connected = state === 'ok';
}

async function apiCall(action, payload){
  if(APPS_SCRIPT_URL.indexOf('PASTE_URL') === 0){
    throw new Error('APPS_SCRIPT_URL belum diisi. Deploy Code.gs dulu lalu tempel URL-nya di bagian atas script.');
  }
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload: payload || {} })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadState(){
  try{
    setConn('pending','Menghubungkan ke Google Sheet…');
    const state = await apiCall('getState');
    counters = state.counters || {};
    history = state.history || [];
    setConn('ok','Terhubung ke Google Sheet');
  }catch(e){
    setConn('bad', 'Gagal terhubung: ' + e.message);
  }
  renderCounters();
  renderHistory();
  updatePreview();
}

function getNextSeqLocal(stage, year){
  if(!counters[stage]) counters[stage] = {};
  return (counters[stage][year] || 0) + 1;
}

function updatePreview(){
  const stage = document.getElementById('stage').value;
  const po = document.getElementById('po').value.trim();
  const month = parseInt(document.getElementById('month').value,10);
  const year = document.getElementById('year').value.trim();
  const qty = Math.max(1, parseInt(document.getElementById('qty').value,10) || 1);
  let seq = getNextSeqLocal(stage, year);
  const lines = [];
  for(let i=0;i<Math.min(qty,5);i++){
    lines.push(formatNumber(seq+i, stage, po || '(No PO)', month, year));
  }
  if(qty>5) lines.push('… + ' + (qty-5) + ' nomor lagi');
  document.getElementById('previewNum').innerHTML = lines.join('<br>');
}

function renderCounters(){
  const year = document.getElementById('year').value.trim();
  const body = document.getElementById('counterBody');
  body.innerHTML = '';
  STAGES.forEach(stage=>{
    const val = (counters[stage] && counters[stage][year]) || 0;
    const tr = document.createElement('tr');
    const editCell = isAdmin
      ? '<input type="number" min="0" value="'+val+'" data-stage="'+stage+'" class="adminCounterInput">'
      : '';
    tr.innerHTML = '<td><span class="badge '+stage+'">'+stage+'</span></td><td class="n">'+pad3(val)+'</td><td>'+editCell+'</td>';
    body.appendChild(tr);
  });
  if(isAdmin){
    body.querySelectorAll('.adminCounterInput').forEach(inp=>{
      inp.addEventListener('change', async (e)=>{
        const stage = e.target.dataset.stage;
        const v = Math.max(0, parseInt(e.target.value,10) || 0);
        try{
          await apiCall('setCounter', {stage, year, value: v});
          if(!counters[stage]) counters[stage] = {};
          counters[stage][year] = v;
          renderCounters();
          updatePreview();
        }catch(err){ alert('Gagal update counter: ' + err.message); }
      });
    });
  }
}

function renderHistory(){
  const stageFilter = document.getElementById('filterStage').value;
  const poFilter = document.getElementById('filterPo').value.trim().toLowerCase();
  const body = document.getElementById('historyBody');
  let rows = history.slice().sort((a,b)=> b.ts - a.ts);
  if(stageFilter) rows = rows.filter(r=>r.stage===stageFilter);
  if(poFilter) rows = rows.filter(r=>r.po.toLowerCase().includes(poFilter));

  body.innerHTML = '';
  if(rows.length===0){
    body.innerHTML = '<tr><td colspan="6" class="empty">Belum ada nomor yang digenerate.</td></tr>';
    return;
  }
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const date = new Date(r.ts);
    const dateStr = date.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    const delCell = isAdmin ? '<button class="delbtn" data-id="'+r.id+'">Hapus</button>' : '';
    tr.innerHTML = '<td><input type="checkbox" class="rowCheck" data-id="'+r.id+'"></td>'
      + '<td><span class="badge '+r.stage+'">'+r.stage+'</span></td>'
      + '<td>'+r.po+'</td>'
      + '<td class="num">'+r.formatted+'</td>'
      + '<td>'+dateStr+'</td>'
      + '<td><button class="copybtn" data-copy="'+r.formatted+'">Salin</button>'+delCell+'</td>';
    body.appendChild(tr);
  });
  body.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      navigator.clipboard.writeText(btn.dataset.copy);
      btn.textContent = 'Tersalin';
      setTimeout(()=>{btn.textContent='Salin';}, 1200);
    });
  });
  body.querySelectorAll('.delbtn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      try{
        await apiCall('deleteHistory', {id});
        history = history.filter(r=>r.id!==id);
        renderHistory();
      }catch(err){ alert('Gagal hapus: ' + err.message); }
    });
  });
  document.getElementById('selectAll').checked = false;
}

document.getElementById('stage').addEventListener('change', updatePreview);
document.getElementById('po').addEventListener('input', updatePreview);
document.getElementById('month').addEventListener('change', updatePreview);
document.getElementById('qty').addEventListener('input', updatePreview);
document.getElementById('year').addEventListener('input', ()=>{ updatePreview(); renderCounters(); });
document.getElementById('filterStage').addEventListener('change', renderHistory);
document.getElementById('filterPo').addEventListener('input', renderHistory);
document.getElementById('selectAll').addEventListener('change', (e)=>{
  document.querySelectorAll('.rowCheck').forEach(cb=>cb.checked = e.target.checked);
});

document.getElementById('genBtn').addEventListener('click', async ()=>{
  const stage = document.getElementById('stage').value;
  const poInput = document.getElementById('po');
  const po = poInput.value.trim();
  const errBox = document.getElementById('poErr');
  if(!po){
    errBox.style.display = 'block';
    poInput.focus();
    return;
  }
  errBox.style.display = 'none';
  const month = parseInt(document.getElementById('month').value,10);
  const year = document.getElementById('year').value.trim();
  const qty = Math.max(1, Math.min(50, parseInt(document.getElementById('qty').value,10) || 1));

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = 'Menyimpan…';

  try{
    const res = await apiCall('generate', {stage, po, month, year, qty});
    const entries = res.entries;
    if(!counters[stage]) counters[stage] = {};
    counters[stage][year] = entries[entries.length-1].seq;
    entries.forEach(en=> history.push(en));

    const resultNum = document.getElementById('resultNum');
    resultNum.innerHTML = entries.map(en=>
      '<div><span>'+en.formatted+'</span><button class="copybtn" data-copy2="'+en.formatted+'">Salin</button></div>'
    ).join('');
    resultNum.querySelectorAll('[data-copy2]').forEach(b=>{
      b.addEventListener('click', ()=>{
        navigator.clipboard.writeText(b.dataset.copy2);
        b.textContent='Tersalin'; setTimeout(()=>{b.textContent='Salin';},1200);
      });
    });
    document.getElementById('resultBox').classList.add('show');

    renderCounters();
    renderHistory();
    updatePreview();
  }catch(err){
    alert('Gagal generate: ' + err.message);
  }

  btn.disabled = false;
  btn.textContent = 'Generate nomor';
});

document.getElementById('adminToggle').addEventListener('click', ()=>{
  if(!isAdmin){
    const pin = prompt('Masukkan PIN admin:');
    if(pin === '1945'){
      isAdmin = true;
      document.getElementById('adminToggle').textContent = 'mode admin aktif';
      document.getElementById('adminToggle').classList.add('active');
      renderCounters();
      renderHistory();
    } else if(pin !== null){
      alert('PIN salah.');
    }
  } else {
    isAdmin = false;
    document.getElementById('adminToggle').textContent = 'mode admin';
    document.getElementById('adminToggle').classList.remove('active');
    renderCounters();
    renderHistory();
  }
});

function rowsToSheetData(rows){
  return rows.map(r=>({
    Stage: r.stage,
    'No PO': r.po,
    Nomor: r.formatted,
    Bulan: ROMAN[r.month-1],
    Tahun: r.year,
    Dibuat: new Date(r.ts).toLocaleString('id-ID')
  }));
}
function doExport(rows, filename){
  if(rows.length===0){ alert('Tidak ada data untuk diekspor.'); return; }
  const ws = XLSX.utils.json_to_sheet(rowsToSheetData(rows));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Riwayat Nomor');
  XLSX.writeFile(wb, filename);
}

document.getElementById('exportAllBtn').addEventListener('click', ()=>{
  const stageFilter = document.getElementById('filterStage').value;
  const poFilter = document.getElementById('filterPo').value.trim().toLowerCase();
  let rows = history.slice().sort((a,b)=> b.ts - a.ts);
  if(stageFilter) rows = rows.filter(r=>r.stage===stageFilter);
  if(poFilter) rows = rows.filter(r=>r.po.toLowerCase().includes(poFilter));
  doExport(rows, 'nomor-dokumen-semua.xlsx');
});
document.getElementById('exportSelectedBtn').addEventListener('click', ()=>{
  const ids = Array.from(document.querySelectorAll('.rowCheck:checked')).map(cb=>cb.dataset.id);
  const rows = history.filter(r=> ids.includes(r.id));
  doExport(rows, 'nomor-dokumen-terpilih.xlsx');
});

loadState();
</script>
</body>
</html>
